[project]
name = "vigilo-stream"
version = "1.0.2"
description = "Zero-copy multi-modal stream fusion engine for real-time AI pipelines"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Abdullah Masood", email = "Abdullah-Masood-05@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/Abdullah-Masood-05/vigilo-stream"
Documentation = "https://abdullah-masood-05.github.io/vigilo-stream/"
Repository = "https://github.com/Abdullah-Masood-05/vigilo-stream"
Issues = "https://github.com/Abdullah-Masood-05/vigilo-stream/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "opencv-python-headless>=4.5",
]

[tool.maturin]
module-name = "vigilo_stream._core"
python-packages = ["vigilo_stream", "rustream"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
